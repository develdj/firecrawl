version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: firecrawl-redis
    networks:
      - firecrawl-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firecrawl-app
    ports:
      - "3002:3002"  # API
      - "3003:3003"  # Bull Dashboard
      - "3004:80"    # Playground UI
      - "3005:3005"  # Worker
    environment:
      # Core Configuration
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - USE_DB_AUTHENTICATION=false
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      
      # Ollama AI Configuration
      - OLLAMA_BASE_URL=http://192.168.1.81:11434/api
      - MODEL_NAME=gpt-oss:20b
      - MODEL_EMBEDDING_NAME=nomic-embed-text:v1.5
      
      # Bull Queue Authentication
      - BULL_AUTH_KEY=${BULL_AUTH_KEY:-CHANGEME}
      
      # Browser Configuration
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      
      # Resource Limits (Jetson Optimized)
      - MAX_CPU=0.75
      - MAX_RAM=0.75
      - NODE_OPTIONS=--max-old-space-size=4096
      
      # Optional: SearXNG Integration
      # - SEARXNG_ENDPOINT=http://searxng-n8ggwkkkcgw8og0wwcc8coow:8080
      
      # Optional: LlamaParse for PDF parsing
      # - LLAMAPARSE_API_KEY=your_key_here
      
      # Optional: Proxy Configuration
      # - PROXY_SERVER=
      # - PROXY_USERNAME=
      # - PROXY_PASSWORD=
      
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - firecrawl-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      # This allows container to access host services (Ollama)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3002"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

networks:
  firecrawl-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
