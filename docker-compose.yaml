version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: firecrawl-redis
    networks:
      - firecrawl-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firecrawl-app
    ports:
      - "3002:3002"  # API
      - "3003:3003"  # Bull Dashboard
      - "3004:80"    # Playground
      - "3005:3005"  # Worker
      - "3006:3006"  # MCP Server
    environment:
      # Core settings
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - USE_DB_AUTHENTICATION=false
      
      # Redis configuration
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      
      # Ollama AI configuration
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/api
      - MODEL_NAME=gpt-oss:20b
      - MODEL_EMBEDDING_NAME=nomic-embed-text:v1.5
      
      # Bull Queue authentication
      - BULL_AUTH_KEY=CHANGEME
      
      # Browser configuration
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      
      # Resource limits (adjusted for Jetson)
      - MAX_CPU=0.75
      - MAX_RAM=0.75
      - NODE_OPTIONS=--max-old-space-size=4096
      
      # MCP configuration
      - MCP_PORT=3006
      - FIRECRAWL_API_URL=http://127.0.0.1:3002
    volumes:
      - ./logs:/app/logs
      - ./firecrawl-data:/app/data
    networks:
      - firecrawl-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3002"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  firecrawl-network:
    driver: bridge

volumes:
  redis-data:
  firecrawl-data:
