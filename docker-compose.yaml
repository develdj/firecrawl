version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: firecrawl-postgres
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_DB: firecrawl
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: firecrawl_password
    networks:
      - firecrawl-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: firecrawl-redis
    networks:
      - firecrawl-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firecrawl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firecrawl-app
    ports:
      - "3002:3002"  # API
      - "3003:3003"  # Bull Dashboard
      - "80:80"    # Playground UI
      - "3005:3005"  # Worker
    environment:
      # Core Configuration
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      #- USE_DB_AUTHENTICATION=true
      # Database Configuration - ADD THIS
      - DATABASE_URL=postgresql://firecrawl:firecrawl_password@postgres:5432/firecrawl
    
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      
      # Ollama AI Configuration
      - OLLAMA_BASE_URL=http://192.168.1.81:11434/api
      - MODEL_NAME=gpt-oss:20b
      - MODEL_EMBEDDING_NAME=nomic-embed-text:v1.5
      
      # Bull Queue Authentication
      - BULL_AUTH_KEY=${BULL_AUTH_KEY:-your-secure-password}
      
      # Browser Configuration
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      
      # Resource Limits (Jetson Optimized)
      - MAX_CPU=0.75
      - MAX_RAM=0.75
      - NODE_OPTIONS=--max-old-space-size=4096
      
      # SearXNG Integration
      - SEARXNG_ENDPOINT=http://192.168.1.81:8888
      - SEARXNG_ENGINES=google,bing,duckduckgo
      - SEARXNG_CATEGORIES=general
      
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - firecrawl-network
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3002"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

networks:
  firecrawl-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
